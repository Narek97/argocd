name: nodejs-api
image:
  repository: ghcr.io/narek97/nodejs-api
  tag: v1.0.4
replicaCount: 2
service:
  type: ClusterIP
  port: 80
  targetPort: 5001
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
envs:
- name: ENV
  value: DEV
- name: NODE_ENV
  value: development
- name: PORT
  value: '5001'
- name: LOG_LEVEL
  value: DEBUG
- name: FEATURE_NEW_DASHBOARD
  value: "true"
- name: TRINO_HOST
  valueFrom:
    secretKeyRef:
      name: nodejs-api-trino-host
      key: data
- name: API_TOKEN
  valueFrom:
    secretKeyRef:
      name: nodejs-api-token
      key: data
- name: DB_PASSWORD
  valueFrom:
    secretKeyRef:
      name: nodejs-api-db-password
      key: data
- name: PAYMENT_API_KEY
  valueFrom:
    secretKeyRef:
      name: nodejs-api-payment-key
      key: data